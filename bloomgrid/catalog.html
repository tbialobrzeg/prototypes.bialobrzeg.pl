<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Bloomgrid — katalog komponentów r7.3</title>
<link rel="stylesheet" href="assets/bloomgrid.css">
<script src="assets/bloomgrid-rules.js"></script>
<script src="assets/bloomgrid-ui.js"></script>
<style>
body.cat-body{margin:0;background:#E4E2DA;font-family:var(--font);color:var(--ink)}
.bg-cat{max-width:1240px;margin:0 auto;padding:32px 24px 80px;background:var(--paper)}
.bg-cat.is-framed{box-shadow:0 0 0 1px var(--line),0 8px 30px rgba(40,34,20,.12)}
.bg-cat.is-narrow{padding:24px 8px 48px}
.bg-cat.is-narrow .cat-grid{grid-template-columns:minmax(0,1fr)}
.bg-cat.is-narrow .cat-spm-box{padding:14px 16px}
.cat-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:2px solid var(--line)}
.cat-head h1{margin:0;font-size:30px;line-height:1.15}
.cat-head p{margin:6px 0 0;color:var(--ink-2);font-size:15px;max-width:66ch;text-wrap:pretty}
.cat-tools{display:flex;gap:6px;align-items:center;font-size:14px}
.cat-tools button{font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cat-tools button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cat-toc{display:flex;flex-wrap:wrap;gap:6px 14px;margin:16px 0 8px;font:13px var(--mono)}
.cat-toc a{color:var(--green-d)}
.cat-sec{padding:36px 0;border-bottom:1px solid var(--line);scroll-margin-top:12px}
.cat-sec > h2{margin:0;font:700 13px var(--mono);color:var(--green);letter-spacing:.02em}
.cat-sec > h3{margin:4px 0 6px;font-size:24px;line-height:1.2}
.cat-sem{margin:0 0 20px;color:var(--ink-2);font-size:16px;max-width:72ch;text-wrap:pretty}
.cat-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
@media (max-width:900px){.cat-grid{grid-template-columns:minmax(0,1fr)}}
.cat-spec{margin:0;display:grid;gap:14px;font-size:14.5px;line-height:1.45}
.cat-spec dt{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.cat-spec dd{margin:2px 0 0;text-wrap:pretty}
.cat-spec code,.cat-sem code,.cat-table code{font:12.5px var(--mono);background:#F0EBDC;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.cat-spec ul{margin:2px 0 0;padding-left:18px}
.cat-specimens{display:flex;flex-wrap:wrap;gap:18px;min-width:0}
.cat-spm{display:flex;flex-direction:column;gap:8px;min-width:0;max-width:100%}
.cat-spm-box{position:relative;max-width:100%;min-width:0;overflow-x:auto;display:flex;align-items:center;justify-content:center;padding:22px;border-radius:14px;background:linear-gradient(180deg,#F3EAD3,#E2D6B8);min-height:96px}
.cat-spm-label{font:11.5px var(--mono);color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.cat-spm-label b{font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.cat-wide{flex-basis:100%;width:100%}.cat-wide .cat-spm-box{width:100%}
.cat-table{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.4}
.cat-table th,.cat-table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.cat-table th{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.cat-table-wrap{overflow-x:auto;max-width:100%}
.cat-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;text-align:center}
.cat-swatch-cell{--cell:56px}
.cat-cellrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cat-shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;width:100%}
.cat-shape{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.6);font:10.5px var(--mono);color:var(--ink-2)}
.cat-dragbox{position:relative}
.cat-finger{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(34,48,30,.18);border:2px solid rgba(34,48,30,.45);transform:translate(-50%,-50%);pointer-events:none}
.cat-finger-label{position:absolute;transform:translate(-100%,0);font:11px var(--mono);color:var(--ink-2);white-space:nowrap}
.cat-demo{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;border-radius:18px;background:linear-gradient(180deg,#F3EAD3,#E2D6B8)}
.cat-demo .bg-strip{width:var(--board-w)}
.cat-demo .bg-tray{width:min(100%,var(--tray-w))}
.cat-stack{display:flex;flex-direction:column;gap:12px;width:min(100%,361px)}
.cat-replay{margin-top:18px;font:700 13px var(--font);padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.cat-replay:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cat-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;width:100%}
.cat-cardbox{position:relative;width:100%;display:flex;justify-content:center}
.cat-note{font-size:13.5px;color:var(--ink-2);margin:8px 0 0}
.cat-spec{grid-template-columns:minmax(0,1fr)}
.cat-mc{display:grid;grid-template-columns:minmax(0,361px) minmax(0,380px);gap:24px 40px;align-items:start;justify-content:start}
.bg-cat.is-narrow .cat-mc{grid-template-columns:minmax(0,1fr)}
.cat-mc-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.cat-mc-title{font:700 12px var(--mono);color:var(--ink-2)}
.cat-mc-row{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;background:linear-gradient(180deg,#F3EAD3,#E2D6B8);min-width:0}
.cat-mc-label{font:11.5px var(--mono);color:var(--ink-2)}
.cat-mc-box{display:flex;justify-content:center;width:100%}
.cat-mc-box .bg-mcard{max-width:100%}
.cat-mc-play{margin-left:6px;font:700 11px var(--mono);padding:1px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cat-mc-box .bg-mcard{position:relative}
.cat-spm-box .bg-mcard{max-width:100%}
.cat-spm-box .bg-mcard .bg-praise{white-space:normal}
</style>
</head>
<body class="cat-body">
<div class="bg-cat" id="cat"></div>
<script>
(async function () {
  'use strict';
  var h = BG.h, root = document.getElementById('cat');
  var fixtures, manifest;
  try { fixtures = await (await fetch('assets/fixtures.json', { cache: 'no-store' })).json(); manifest = await (await fetch('prototype-manifest.json', { cache: 'no-store' })).json(); }
  catch (e) { root.append(h('div', { 'class': 'bg-error', role: 'alert' }, 'Nie można wczytać assets/fixtures.json lub prototype-manifest.json — uruchom przez lokalny serwer HTTP (README.md).')); return; }
  var lang = 'default';
  var cq = new URLSearchParams(location.search);
  var ctg = manifest.targets.filter(function (t) { return t.target_id === cq.get('target'); })[0] || manifest.targets.filter(function (t) { return t.target_id === 'mac-wide'; })[0];
  var cUrl = function (t) { var u = new URLSearchParams(); u.set('target', t); return '?' + u.toString(); };
  if (cq.get('target') !== ctg.target_id) history.replaceState(null, '', cUrl(ctg.target_id));
  root.style.maxWidth = Math.min(1240, ctg.width) + 'px';
  if (ctg.width < 1240) root.classList.add('is-framed');
  if (ctg.width < 900) root.classList.add('is-narrow');
  var cbar = BG.previewToolbar({
    catalogHref: cUrl(ctg.target_id), catalogCurrent: true,
    backHref: 'index.html?mode=user_preview&state=' + encodeURIComponent(manifest.states[0].state_id) + '&target=' + encodeURIComponent(ctg.target_id),
    targetId: ctg.target_id, noteStateId: 'catalog', targets: manifest.targets,
    onTarget: function (t) { location.search = cUrl(t); }
  });
  document.body.append(cbar);
  var cfit = function () { document.body.style.paddingBottom = cbar.offsetHeight + 'px'; };
  cfit(); window.addEventListener('resize', cfit);
  if (window.ResizeObserver) new ResizeObserver(cfit).observe(cbar);
  await BG.preload();

  function spm(label, note, node, opts) {
    opts = opts || {};
    return h('div', { 'class': 'cat-spm' + (opts.wide ? ' cat-wide' : ''), 'data-catalog-variant': label },
      h('div', { 'class': 'cat-spm-box', style: opts.boxStyle || null }, node),
      h('div', { 'class': 'cat-spm-label' }, h('b', {}, label), note || null));
  }
  /* r5: przycisk „Odtwórz” przy animacji — narzędzie katalogu (data-prototype-tool), nie UI produktu. */
  function replayBtn(fn, label) {
    return h('button', { type: 'button', 'class': 'cat-replay', 'data-prototype-tool': 'catalog-replay', onclick: fn }, '▶ ' + (label || 'Odtwórz'));
  }
  function spec(rows) { return h('dl', { 'class': 'cat-spec' }, rows.map(function (r) { return [h('dt', { html: r[0] }), h('dd', { html: r[1] })]; })); }
  function table(head, rows) {
    return '<div class="cat-table-wrap"><table class="cat-table"><thead><tr>' + head.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function section(id, title, sem, specRows, specimens) {
    return h('section', { 'class': 'cat-sec', id: id, 'data-catalog-component': id },
      h('h2', {}, id), h('h3', {}, title), h('p', { 'class': 'cat-sem', html: sem }),
      h('div', { 'class': 'cat-grid' }, spec(specRows), h('div', { 'class': 'cat-specimens' }, specimens)));
  }
  function geoCell(cell) { var gap = 3, pad = 6; return { cell: cell, gap: gap, pad: pad, boardW: 8 * cell + 9 * gap + 2 * pad }; }
  function cellBox(o, size) { var w = h('div', { style: { '--cell': (size || 52) + 'px', position: 'relative' } }, BG.cell(o)); return w; }
  var narrow = ctg.width < 900;
  var specCell = narrow ? 26 : 30;

  function render() {
    var fx = fixtures.fixtures[lang], S = fx.strings, loc = fx.locale, C = fx.catalog;
    document.documentElement.lang = loc;
    root.replaceChildren();
    root.append(h('header', { 'class': 'cat-head' },
      h('div', {}, h('h1', {}, 'Bloomgrid — katalog komponentów'),
        h('p', {}, 'Rewizja r7.4 (Q394–Q402): punktacja i poziomy jak w aplikacji od 2026-11-20 — X = 80, położenie bez linii 0 punktów, k linii naraz X·3^(k−1), linia jednego koloru +9X (720), Pełne podlanie +6X (480), Pusta grządka max(12X, 6X × poziom) albo 25X w wyzwaniu dnia, poziom = 1 + ⌊wynik / 800⌋; wyniki stanów z danych aplikacji; usunięty stan game.level-up-no-clear; wygląd bez zmian. ' +
          'Rewizja r7.3 (Q339–Q362): Podlewanie to kropelki za zbicie kilku linii naraz (3 kropelki = „Pełne podlanie!” i +480 od r7.4); komunikaty ruchu w kolejce, jedna karta naraz (punkty → kropelki albo Pełne podlanie → rekord → poziom); korekta Q366: osiem kart z własną ilustracją, kolorem, animacją, dźwiękiem i czasem 2–3,4 s, bez efektów poza kartą; drabina pochwał z liczby linii naraz. Wcześniej w r7.3 (Q339–Q354): jeden sposób komunikatów chwilowych — karta ruchu (component.move-card: pochwała, punkty z pełnym rozbiciem, nowy poziom, nowy rekord) zamiast osobnej pochwały nad planszą, dopisków punktów i plakietki awansu na wyniku; święto pełnego podlania (component.full-watering) przy Podlewaniu ×6; większa roślina Podlewania i większe odstępy wynik–Podlewanie–karta; „+500” zamiast „×2” na linii jednego koloru. ' +
          'Rewizja r7 (Q232–Q234): przełączniki „Muzyka” i „Efekty”; na telefonach etykieta poziomu w wierszu pod nagłówkiem; drabina czterech pochwał według siły ruchu; Podlewanie (roślina i krople) zamiast „Seria ×c”; Kolorowa rabata; święto Pustej grządki +2500 (sekcje component.sound-toggle, component.combo-badge, foundation.motion z „Odtwórz”). Z r6 (Q147–Q153, Q175, Q176, Q184, Q185): poziomy gry klasycznej — krąg sześciu motywów tła, etykieta poziomu w nagłówku, plakietka awansu i przenikanie tła, poziom w panelu końca; bez stuknij-stuknij (Q185); przycisk „' + S.to_home + '” w panelu końca (Q184); stany po ruchu bez ramki czyszczenia; deszcz płatków przez całą wysokość karty. Z r5 (Q128–Q143, Q162): krok końca gry z komunikatem i oznaczeniem trójki, panel końca z powodem i różnicą do rekordu, przełącznik dźwięku, animacje z przyciskami „Odtwórz” (foundation.motion). Z r4 (Q111–Q114): tekst wyśrodkowany w poziomie wszędzie; na mac-wide wspólna siatka (przycisk domu i rekord na krawędziach planszy i tacki, wynik, seria i punkty na osi środkowego slotu), większy przycisk domu i rekord; sloty tacki bez szwów. Z r3: nowy wygląd z grafik rastrowych (Q96, Q102–Q106) — kafle z kwiatami, drewniana skrzynia planszy, przyciski i panele z obrazów, trzy ilustrowane tła sceny. Zachowanie, układ, stany, komponenty i publiczne ID bez zmian względem r2. Każdy komponent pokazuje przeznaczenie, warianty, konfiguracje, stany interakcji, rolę i nazwę dostępną, kontrakt akcji (action → expected_effect) w każdym kontekście oraz różnice responsywne. Okazy renderuje ten sam runtime co index.html (assets/bloomgrid-ui.js, reguły w assets/bloomgrid-rules.js). Teksty z fixture „' + lang + '”.')),
      h('div', { 'class': 'cat-tools', 'data-prototype-tool': 'catalog-fixture' }, 'fixture:',
        ['default', 'english'].map(function (f) { return h('button', { type: 'button', 'aria-pressed': f === lang ? 'true' : 'false', onclick: function () { lang = f; render(); } }, f); }))));
    var ids = ['komunikaty', 'foundation.palette', 'component.board-cell', 'component.board', 'component.piece', 'component.piece-tray', 'component.score-display', 'component.combo-badge', 'component.move-card', 'component.move-points', 'component.mode-label', 'component.level-label', 'component.icon-button', 'component.menu-button', 'component.button', 'component.wordmark', 'component.dialog', 'component.game-over-panel', 'component.alert', 'component.sound-toggle', 'component.no-moves-step', 'foundation.motion', 'responsive', 'states-plan'];
    root.append(h('nav', { 'class': 'cat-toc' }, ids.map(function (i) { return h('a', { href: '#' + i }, i); })));

    /* r7.3 (Q366–Q368): Komunikaty chwilowe — osiem treści jednej karty (component.move-card) w dwóch rozmiarach, obok siebie,
       bez reszty ekranu. Do pokazania Tomaszowi; capture: data-element-id="specimen.move-cards", karty specimen.move-card.<nr>-<rozmiar>. */
    (function () {
      var Pk = function (place, k, mono, empty) { var lines = BGRules.X * Math.pow(3, k - 1); return { place: 0, cleared: k, lines: lines, full: 0, mono: mono || 0, empty: empty || 0, total: lines + (mono || 0) + (empty || 0) }; };
      var items = [
        /* r7.4 (Q394–Q402): liczby z reguł punktacji (X = 80; linie X·3^(k−1), Kolorowa rabata +9X, Pusta grządka max(12X, 6X × poziom), rekord wielokrotnością X); wygląd kart bez zmian. */
        ['1', 'punkty', { points: Pk(0, 1) }],
        ['2', 'punkty z pochwałą', { praise: 'wonderful', points: Pk(3, 3) }],
        ['3', 'Kolorowa rabata', { praise: 'flowerbed', points: Pk(0, 1, 720) }],
        ['4', 'Pusta grządka', { points: Pk(0, 2, 0, 960) }],
        ['5', 'kropelki', { step: 'drops', gain: 2 }],
        ['6', 'Pełne podlanie', { step: 'full', count: 1 }],
        ['7', 'nowy rekord', { step: 'record', score: 18480 }],
        ['8', 'nowy poziom', { step: 'level', level: { n: 4, motif: 'hedge' } }]];
      /* Korekta Q366 (zaakceptowana: „ładne, niech będą i użyjmy w grze”): karty z runtime gry (BG.moveCard) — ten sam wygląd co w stanach gry.
         Domyślnie klatka szczytowa (do zrzutu); „▶” odtwarza wejście i efekt karty (klasa is-play przez data-duration-ms). */
      var card = function (it, size) {
        var nr = it[0], o = it[2], id = 'specimen.move-card.' + nr + '-' + size;
        return BG.moveCard({ S: S, loc: loc, step: o.step || 'points', praise: o.praise || null, points: o.points, gain: o.gain, dropsAfter: o.dropsAfter, count: o.count, score: o.score, level: o.level,
          ids: { card: id, praise: id + '.head', points: id + '.num', drops: id + '.head', full: id + '.head', level: id + '.head', record: id + '.head' } });
      };
      var play = function (el) { el.classList.remove('is-play'); void el.offsetWidth; el.classList.add('is-play'); clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('is-play'); }, +el.getAttribute('data-duration-ms')); };
      var col = function (size) {
        var wide = size === 'mac-wide';
        return h('div', { 'class': 'cat-mc-col ' + (wide ? 'bg-wide' : 'bg-phone') },
          h('div', { 'class': 'cat-mc-title' }, wide ? 'mac-wide (gniazdo 380 px)' : 'telefon (do 361 px)'),
          items.map(function (it) {
            var el = card(it, size);
            return h('div', { 'class': 'cat-mc-row' },
              h('span', { 'class': 'cat-mc-label' }, it[0] + ' · ' + it[1] + ' · ' + el.getAttribute('data-sound') + ' · ' + (+el.getAttribute('data-duration-ms') / 1000).toLocaleString('pl-PL') + ' s ',
                h('button', { type: 'button', 'class': 'cat-mc-play', 'data-prototype-tool': 'catalog-replay', 'aria-label': 'Odtwórz kartę ' + it[0], onclick: function () { play(el); } }, '▶')),
              h('div', { 'class': 'cat-mc-box', style: { maxWidth: (wide ? 380 : 361) + 'px' } }, el));
          }));
      };
      var cols = h('div', { 'class': 'cat-mc', 'data-element-id': 'specimen.move-cards' }, col('phone'), col('mac-wide'));
      root.append(h('section', { 'class': 'cat-sec', id: 'komunikaty', 'data-catalog-component': 'komunikaty' },
        h('h2', {}, 'komunikaty'), h('h3', {}, 'Komunikaty chwilowe — osiem kart (r7.3, korekta Q366)'),
        h('p', { 'class': 'cat-sem', html: 'Zaakceptowane przez Tomasza („ładne, niech będą i użyjmy w grze”) i użyte w stanach gry — te same karty rysuje runtime gry (<a href="#component.move-card">component.move-card</a>). Wspólne: jedno miejsce nad planszą (mac-wide: gniazdo w kolumnie), jedna karta naraz w kolejce, czas na przeczytanie, ta sama ramka (kremowa karta, obrys 2 px, cień) i te same fonty i rozmiary (nagłówek 22 / 26 px, liczba 32 / 42 px, podpis 13 / 15 px). Własne: ilustracja obok tekstu, kolor, animacja wejścia i efekt, dźwięk z R-6.1. Karty 1–4 to warianty karty punktów ruchu — ruch pokazuje dokładnie jedną (R-2.9: Pusta grządka, Kolorowa rabata, pochwała z liczby linii, zwykłe punkty). Ilustracje to własne SVG i istniejące obrazy (kafle, płatki, rośliny, tła), bez nowych wywołań generatora. Domyślnie stała klatka szczytowa; „▶” odtwarza kartę. W etykiecie: dźwięk i czas karty.' }),
        h('div', { 'class': 'cat-tools', 'data-prototype-tool': 'catalog-replay-all', style: { margin: '0 0 14px' } }, h('button', { type: 'button', onclick: function () { [].forEach.call(cols.querySelectorAll('.bg-mcard'), play); } }, '▶ Odtwórz wszystkie')),
        cols));
    })();

    /* Podstawy: kolory i symbole */
    var colorRows = [['poppy', 'mak — 4 szerokie okrągłe płatki, ciemny środek', '#D44624', '3,84', '#D91D08', 'tile-poppy'], ['sun', 'słonecznik — wieniec wąskich płatków, duży brązowy środek', '#F4BB3D', '9,81', '#D89F2E', 'tile-sun'], ['leaf', 'koniczyna — 4 liście w kształcie serca', '#22A663', '5,47', '#0DA86F', 'tile-leaf'], ['drop', 'chaber — kolczasta gwiazda płatków', '#3C74C3', '3,65', '#4770C4', 'tile-drop'], ['berry', 'kwiat wiśni — kwiaty o 5 płatkach z wcięciem', '#E1339C', '4,21', '#B743A7', 'tile-berry']];
    root.append(section('foundation.palette', 'Kafle z kwiatami, tła sceny i oprawa',
      'Pięć kolorów klocków (R-1.3), każdy z własnym kwiatem na każdym polu, na planszy i w trójce (R-1.9, Q27, Q103). Kwiat, a nie barwa, jest pierwszym rozróżnieniem: kolory dają się odróżnić bez widzenia barw (WCAG 1.4.1); para mak–kwiat wiśni różni się sylwetką (4 okrągłe płatki z ciemnym środkiem kontra gromada kwiatów o 5 płatkach z wcięciem). Klucze kolorów w kodzie i DOM (<code>data-color</code>) bez zmian. Jeden jasny wygląd niezależnie od trybu ciemnego systemu (Q32, Q101).',

    var nmBoard = BGRules.parseBoard(['pdsl.bsd', 'lb.dpsl.', 'sdplb.bp', '.bsdlpds', 'dlb.sp.l', 'sp.dlbsd', 'ldsbp.pl', 'd.spl.sd']);
    function noMovesDemo(lang2) {
      var g = geoCell(narrow ? 22 : 26), b = BG.board({ geo: g, S: S, elementId: 'catalog.nomoves.board', elementPrefix: 'catalog.nomoves.board.' });
      b.render(nmBoard, {});
      var tg = { pc: 12, pg: 2, slotH: 5 * 12 + 4 * 2 + 18, slotPx: Math.floor((g.boardW - 24) / 3), slotGap: 12 };
      var tr = BG.tray({ geo: tg, S: S, elementId: 'catalog.nomoves.tray' });
      tr.el.style.width = g.boardW + 'px';
      tr.render([{ shape: 'square3', color: 'berry' }, { shape: 'line5-h', color: 'sun' }, { shape: 'rect-3x2', color: 'drop' }], function (p, i) { return BG.piece({ piece: p, cell: 12, gap: 2, S: S, elementId: 'catalog.nomoves.piece-' + (i + 1), variant: 'static' }); });
      var msg = h('div', { 'class': 'cat-nomoves-msg bg-nomoves-msg', style: { position: 'relative', transform: 'none' } }, S.no_moves);
      var box = h('div', { 'class': 'cat-stack', style: { alignItems: 'center', gap: '18px' } }, b.el, msg, tr.el);
      function mark(on) {
        b.el.classList.toggle('is-ended', on); msg.style.visibility = on ? 'visible' : 'hidden';
        tr.pieces.forEach(function (pe, i) {
          pe.setAttribute('data-variant', on ? 'no-fit' : 'static');
          if (on) { tr.slots[i].setAttribute('data-no-fit', 'true'); if (!tr.slots[i].querySelector('.bg-nofit-mark')) tr.slots[i].append(h('span', { 'class': 'bg-nofit-mark', 'aria-hidden': 'true' }, BG.icon('no-fit', 16))); }
          else { tr.slots[i].removeAttribute('data-no-fit'); var m = tr.slots[i].querySelector('.bg-nofit-mark'); if (m) m.remove(); }
        });
      }
      mark(true);
      var play = function () {
        mark(false);
        setTimeout(function () { box.classList.add('bg-anim'); mark(true); if (BG.fx.reduced()) BG.fx.fade(msg); else BG.fx.play(msg, 'fx-rise', 300); }, 400);
      };
      return h('div', {}, box, replayBtn(play, 'Odtwórz krok końca'));
    }
